server_tokens off;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml
  text/css
  text/plain
  text/xml;

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name telli-apps.de;

  return 308 https://www.telli-apps.de$request_uri;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name www.telli-apps.de;
  root /usr/share/nginx/html;

  include /etc/nginx/snippets/telliapps-security.conf;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/planteller(?:/(.*))?$ {
    return 308 https://planteller.telli-apps.de/$1$is_args$args;
  }

  location ~ ^/planparty(?:/(.*))?$ {
    return 308 https://planparty.telli-apps.de/$1$is_args$args;
  }

  location ^~ /_astro/ {
    expires 1y;
  }

  location ^~ /assets/ {
    expires 7d;
  }

  location ^~ /media/ {
    expires 7d;
  }

  location / {
    expires -1;
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name planteller.telli-apps.de;
  root /usr/share/nginx/html/planteller;

  include /etc/nginx/snippets/telliapps-security.conf;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ^~ /_astro/ {
    alias /usr/share/nginx/html/_astro/;
    expires 1y;
  }

  location ^~ /assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 7d;
  }

  location ^~ /media/ {
    alias /usr/share/nginx/html/media/;
    expires 7d;
  }

  location = /planteller/favicon.png {
    alias /usr/share/nginx/html/planteller/favicon.png;
  }

  location = /planteller/apple-touch-icon.png {
    alias /usr/share/nginx/html/planteller/apple-touch-icon.png;
  }

  location = /planteller/site.webmanifest {
    alias /usr/share/nginx/html/planteller/site.webmanifest;
  }

  location ~ ^/recipe-share(?:/.*)?$ {
    expires -1;
    try_files /recipe-share/index.html =404;
  }

  location ~ ^/collection-share(?:/.*)?$ {
    expires -1;
    try_files /collection-share/index.html =404;
  }

  location ~ ^/invite(?:/.*)?$ {
    expires -1;
    try_files /invite/index.html =404;
  }

  location ~ ^/reset-password(?:/.*)?$ {
    expires -1;
    try_files /reset-password/index.html =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404/index.html;
  location = /404/index.html {
    internal;
  }
}

